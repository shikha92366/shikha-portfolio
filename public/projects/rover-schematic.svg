<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F0C1B"/>
      <stop offset="1" stop-color="#19142E"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#241C42"/>
      <stop offset="1" stop-color="#161229"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#8B5CF6" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800" stroke="#8B5CF6" stroke-opacity="0.05" stroke-width="1"/>

  <!-- High-Level Compute (Pi CM4) -->
  <g transform="translate(40, 110)">
    <rect width="210" height="230" rx="10" fill="url(#cardGrad6)" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="105" y="35" fill="#C4B5FD" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">RASPBERRY PI CM4</text>
    <text x="105" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">ROS2 Nav2 + SLAM</text>
    <rect x="20" y="80" width="170" height="38" rx="6" fill="#4C1D95" fill-opacity="0.4"/>
    <text x="105" y="104" fill="#EDE9FE" font-family="sans-serif" font-size="11" text-anchor="middle">Cartographer 2D SLAM</text>
    <rect x="20" y="128" width="170" height="38" rx="6" fill="#5B21B6" fill-opacity="0.4"/>
    <text x="105" y="152" fill="#EDE9FE" font-family="sans-serif" font-size="11" text-anchor="middle">RPLiDAR A1 360° Scan</text>
    <rect x="20" y="176" width="170" height="38" rx="6" fill="#6D28D9" fill-opacity="0.4"/>
    <text x="105" y="200" fill="#DDD6FE" font-family="monospace" font-size="11" text-anchor="middle">micro-ROS Agent (UART)</text>
  </g>

  <!-- Low-Level Co-Processor (STM32G4) -->
  <g transform="translate(310, 110)">
    <rect width="210" height="230" rx="10" fill="url(#cardGrad6)" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="105" y="35" fill="#C4B5FD" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">STM32G4 CO-PROCESSOR</text>
    <text x="105" y="58" fill="#A78BFA" font-family="monospace" font-size="11" text-anchor="middle">Cortex-M4 @ 170MHz</text>
    <rect x="20" y="80" width="170" height="38" rx="6" fill="#4C1D95" stroke="#7C3AED"/>
    <text x="105" y="104" fill="#EDE9FE" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">100Hz PID Velocity Loop</text>
    <rect x="20" y="128" width="170" height="38" rx="6" fill="#3B0764" fill-opacity="0.4"/>
    <text x="105" y="152" fill="#DDD6FE" font-family="sans-serif" font-size="11" text-anchor="middle">BNO085 9-DOF IMU Fusion</text>
    <rect x="20" y="176" width="170" height="38" rx="6" fill="#3B0764" fill-opacity="0.4"/>
    <text x="105" y="200" fill="#34D399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">Sub-2cm Accuracy</text>
  </g>

  <!-- Actuators & Power -->
  <g transform="translate(580, 110)">
    <rect width="180" height="230" rx="10" fill="url(#cardGrad6)" stroke="#EC4899" stroke-width="1.5"/>
    <text x="90" y="35" fill="#F472B6" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ACTUATION &amp; POWER</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Dual DC Gearmotors</text>
    <rect x="20" y="80" width="140" height="38" rx="6" fill="#831843" fill-opacity="0.4"/>
    <text x="90" y="104" fill="#FCE7F3" font-family="monospace" font-size="11" text-anchor="middle">1024 CPR Encoders</text>
    <rect x="20" y="128" width="140" height="38" rx="6" fill="#9D174D" fill-opacity="0.4"/>
    <text x="90" y="152" fill="#FCE7F3" font-family="sans-serif" font-size="11" text-anchor="middle">H-Bridge PWM Drive</text>
    <rect x="20" y="176" width="140" height="38" rx="6" fill="#BE185D" fill-opacity="0.4"/>
    <text x="90" y="200" fill="#FDF2F8" font-family="monospace" font-size="11" text-anchor="middle">11.1V 3S LiPo Rail</text>
  </g>

  <path d="M250 225 H 310 M 520 225 H 580" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="40" y="30" width="380" height="36" rx="18" fill="#2E1065" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <circle cx="60" cy="48" r="5" fill="#A78BFA"/>
  <text x="75" y="53" fill="#EDE9FE" font-family="sans-serif" font-weight="600" font-size="13">Autonomous Rover micro-ROS Architecture</text>
</svg>
