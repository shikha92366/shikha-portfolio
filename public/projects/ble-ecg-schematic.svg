<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050C17"/>
      <stop offset="1" stop-color="#09182A"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E223D"/>
      <stop offset="1" stop-color="#09182A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- AD8232 AFE -->
  <g transform="translate(40, 130)">
    <rect width="180" height="190" rx="10" fill="url(#cardGrad4)" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="90" y="35" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">AD8232 ANALOG AFE</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Lead-I Biopotential</text>
    
    <!-- ECG Waveform preview -->
    <path d="M30 110 H 60 L 70 90 L 80 140 L 90 70 L 100 120 L 110 110 H 150" stroke="#00E5FF" stroke-width="2" fill="none"/>
    <text x="90" y="165" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle">250Hz Differential</text>
  </g>

  <!-- nRF52840 MCU -->
  <g transform="translate(280, 100)">
    <rect width="240" height="250" rx="12" fill="#0A1D36" stroke="#38BDF8" stroke-width="2"/>
    <text x="120" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">Nordic nRF52840</text>
    <text x="120" y="58" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">Zephyr RTOS + PPI</text>

    <rect x="20" y="80" width="200" height="40" rx="6" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="120" y="105" fill="#E0F2FE" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pan-Tompkins QRS Algorithm</text>

    <rect x="20" y="130" width="200" height="40" rx="6" fill="#082F49" stroke="#0369A1"/>
    <text x="120" y="155" fill="#BAE6FD" font-family="sans-serif" font-size="12" text-anchor="middle">Adaptive Connection Interval</text>

    <rect x="20" y="180" width="200" height="40" rx="6" fill="#082F49" stroke="#0369A1"/>
    <text x="120" y="205" fill="#34D399" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">CR2032 14-Day Life</text>
  </g>

  <!-- BLE 5.3 Output -->
  <g transform="translate(580, 130)">
    <rect width="180" height="190" rx="10" fill="url(#cardGrad4)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="90" y="35" fill="#C084FC" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">BLE 5.3 GATT</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">2Mbps PHY Streaming</text>
    <rect x="20" y="80" width="140" height="40" rx="6" fill="#581C87" fill-opacity="0.4"/>
    <text x="90" y="105" fill="#F3E8FF" font-family="monospace" font-size="11" text-anchor="middle">&lt;35ms Latency</text>
    <rect x="20" y="130" width="140" height="40" rx="6" fill="#3B0764" fill-opacity="0.4"/>
    <text x="90" y="155" fill="#E9D5FF" font-family="sans-serif" font-size="11" text-anchor="middle">Web Bluetooth Sync</text>
  </g>

  <path d="M220 225 H 280 M 520 225 H 580" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="40" y="30" width="370" height="36" rx="18" fill="#0C2340" stroke="#38BDF8" stroke-opacity="0.5"/>
  <circle cx="60" cy="48" r="5" fill="#38BDF8"/>
  <text x="75" y="53" fill="#BAE6FD" font-family="sans-serif" font-weight="600" font-size="13">BLE 5.3 Medical ECG Patch Schematic</text>
</svg>
