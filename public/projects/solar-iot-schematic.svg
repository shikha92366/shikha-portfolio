<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06121E"/>
      <stop offset="1" stop-color="#0A1E2E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E2838"/>
      <stop offset="1" stop-color="#091B26"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <!-- Grid -->
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Energy Harvester -->
  <g transform="translate(40, 140)">
    <rect width="160" height="180" rx="10" fill="url(#panelGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="80" y="35" fill="#FBBF24" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">SOLAR MPPT</text>
    <text x="80" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">BQ25570 Harvester</text>
    <rect x="20" y="80" width="120" height="36" rx="6" fill="#78350F" fill-opacity="0.3"/>
    <text x="80" y="102" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">LiFePO4 3.2V Cell</text>
    <rect x="20" y="128" width="120" height="30" rx="6" fill="#14532D" fill-opacity="0.4"/>
    <text x="80" y="148" fill="#4ADE80" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">8.4 µA Sleep</text>
  </g>

  <!-- Central Processing ESP32-S3 -->
  <g transform="translate(260, 110)">
    <rect width="240" height="230" rx="12" fill="#0B202D" stroke="#10B981" stroke-width="2"/>
    <text x="120" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">ESP32-S3 CORE</text>
    <text x="120" y="58" fill="#34D399" font-family="monospace" font-size="12" text-anchor="middle">Xtensa Dual-Core + ULP</text>

    <rect x="20" y="80" width="200" height="40" rx="6" fill="#134E4A" stroke="#2DD4BF"/>
    <text x="120" y="105" fill="#CCFBF1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ULP Coprocessor State Machine</text>

    <rect x="20" y="130" width="200" height="40" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="120" y="155" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">SDI-12 Soil &amp; Weather Ingest</text>

    <rect x="20" y="180" width="200" height="35" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="120" y="202" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">AES-128 Hardware Crypt</text>
  </g>

  <!-- LoRa Semtech Module -->
  <g transform="translate(560, 140)">
    <rect width="180" height="180" rx="10" fill="url(#panelGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="90" y="35" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">SX1262 LoRaWAN</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">868 / 915 MHz</text>
    <rect x="20" y="80" width="140" height="36" rx="6" fill="#0369A1" fill-opacity="0.3"/>
    <text x="90" y="102" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle">+22dBm Tx Power</text>
    <rect x="20" y="128" width="140" height="30" rx="6" fill="#0284C7" fill-opacity="0.4"/>
    <text x="90" y="148" fill="#E0F2FE" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">12.4 km Range</text>
  </g>

  <!-- Traces -->
  <path d="M200 230 H 260 M 500 230 H 560" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Top Title -->
  <rect x="40" y="30" width="340" height="36" rx="18" fill="#06281D" stroke="#10B981" stroke-opacity="0.5"/>
  <circle cx="60" cy="48" r="5" fill="#10B981"/>
  <text x="75" y="53" fill="#D1FAE5" font-family="sans-serif" font-weight="600" font-size="13">Solar IoT LoRaWAN Architecture System</text>
</svg>
