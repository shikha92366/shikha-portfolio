<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1A"/>
      <stop offset="1" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="200" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Circuit Grid Lines -->
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Trace Lines -->
  <path d="M190 225 H 280 M 500 225 H 590 M 390 120 V 160 M 390 290 V 330" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6"/>

  <!-- Block 1: Sensor & SPI DMA -->
  <g transform="translate(40, 160)">
    <rect width="150" height="130" rx="10" fill="url(#chipGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="75" y="40" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">IIS3DWB SENSOR</text>
    <text x="75" y="65" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">3-Axis 26.7kHz</text>
    <rect x="25" y="85" width="100" height="24" rx="4" fill="#0369A1" fill-opacity="0.3"/>
    <text x="75" y="101" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">SPI DMA CircBuf</text>
  </g>

  <!-- Block 2: STM32H7 Main MCU -->
  <g transform="translate(280, 100)">
    <rect width="220" height="250" rx="12" fill="#0A1628" stroke="#00E5FF" stroke-width="2"/>
    <!-- Glow Effect -->
    <rect x="-2" y="-2" width="224" height="254" rx="14" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    
    <text x="110" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">STM32H743ZI</text>
    <text x="110" y="58" fill="#00E5FF" font-family="monospace" font-size="12" text-anchor="middle">ARM Cortex-M7 @ 480MHz</text>
    
    <!-- Sub-blocks inside MCU -->
    <rect x="20" y="80" width="180" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="110" y="106" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">1024-Point Real FFT DSP</text>

    <rect x="20" y="132" width="180" height="48" rx="6" fill="#042F2E" stroke="#10B981" stroke-width="1.5"/>
    <text x="110" y="152" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CMSIS-NN INT8 Inference</text>
    <text x="110" y="168" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">11.2 ms | 24KB Arena</text>

    <rect x="20" y="190" width="180" height="38" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="110" y="214" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">FreeRTOS Task Scheduler</text>
  </g>

  <!-- Block 3: Decision & Alert Dispatch -->
  <g transform="translate(590, 160)">
    <rect width="170" height="130" rx="10" fill="url(#chipGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="85" y="40" fill="#34D399" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">EDGE TELEMETRY</text>
    <text x="85" y="65" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">CAN 2.0B / UART</text>
    <rect x="20" y="85" width="130" height="24" rx="4" fill="#065F46" fill-opacity="0.4"/>
    <text x="85" y="101" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">97.4% F1 Detection</text>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="320" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4"/>
  <circle cx="60" cy="48" r="5" fill="#00E5FF"/>
  <text x="75" y="53" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="13">Edge AI TinyML Architecture Diagram</text>
</svg>
