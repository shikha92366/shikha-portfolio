<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F16"/>
      <stop offset="1" stop-color="#0D1C28"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#112738"/>
      <stop offset="1" stop-color="#0C1B26"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#0284C7" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800" stroke="#0284C7" stroke-opacity="0.05" stroke-width="1"/>

  <!-- RS485 Side -->
  <g transform="translate(40, 130)">
    <rect width="180" height="190" rx="10" fill="url(#cardGrad5)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="90" y="35" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">RS485 MODBUS RTU</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Isolated MAX485</text>
    <rect x="20" y="80" width="140" height="40" rx="6" fill="#075985" fill-opacity="0.3"/>
    <text x="90" y="105" fill="#BAE6FD" font-family="monospace" font-size="12" text-anchor="middle">32 Multi-Drop Slaves</text>
    <rect x="20" y="130" width="140" height="40" rx="6" fill="#0C4A6E" fill-opacity="0.3"/>
    <text x="90" y="155" fill="#E0F2FE" font-family="monospace" font-size="11" text-anchor="middle">CRC16 Hardware Check</text>
  </g>

  <!-- Central Bridge STM32F4 -->
  <g transform="translate(280, 100)">
    <rect width="240" height="250" rx="12" fill="#0C2438" stroke="#0284C7" stroke-width="2"/>
    <text x="120" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">STM32F429ZI</text>
    <text x="120" y="58" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">FreeRTOS + lwIP Stack</text>

    <rect x="20" y="80" width="200" height="40" rx="6" fill="#075985" stroke="#0284C7"/>
    <text x="120" y="105" fill="#E0F2FE" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Register Mapping Engine</text>

    <rect x="20" y="130" width="200" height="40" rx="6" fill="#0C4A6E" stroke="#0369A1"/>
    <text x="120" y="155" fill="#BAE6FD" font-family="sans-serif" font-size="12" text-anchor="middle">MbedTLS 1.3 Hardware AES</text>

    <rect x="20" y="180" width="200" height="40" rx="6" fill="#0C4A6E" stroke="#0369A1"/>
    <text x="120" y="205" fill="#34D399" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">720h 0% Packet Loss</text>
  </g>

  <!-- Ethernet / MQTT Cloud -->
  <g transform="translate(580, 130)">
    <rect width="180" height="190" rx="10" fill="url(#cardGrad5)" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="35" fill="#34D399" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">CLOUD MQTT</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">LAN8720A 100Mbps</text>
    <rect x="20" y="80" width="140" height="40" rx="6" fill="#065F46" fill-opacity="0.3"/>
    <text x="90" y="105" fill="#A7F3D0" font-family="monospace" font-size="12" text-anchor="middle">AWS IoT / SCADA</text>
    <rect x="20" y="130" width="140" height="40" rx="6" fill="#047857" fill-opacity="0.3"/>
    <text x="90" y="155" fill="#D1FAE5" font-family="sans-serif" font-size="11" text-anchor="middle">Dual-Bank Rollback</text>
  </g>

  <path d="M220 225 H 280 M 520 225 H 580" stroke="#0284C7" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="40" y="30" width="370" height="36" rx="18" fill="#082F49" stroke="#0284C7" stroke-opacity="0.5"/>
  <circle cx="60" cy="48" r="5" fill="#0284C7"/>
  <text x="75" y="53" fill="#E0F2FE" font-family="sans-serif" font-weight="600" font-size="13">Modbus RTU to Cloud MQTT Bridge</text>
</svg>
